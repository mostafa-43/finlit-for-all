<div class="card resource-card h-100">
  <img *ngIf="resource.image" [src]="resource.image" class="card-img-top resource-card-image" alt="Resource cover">
  <div class="card-body d-flex flex-column">
    <span *ngIf="resource.category" class="article-category">{{ resource.category }}</span>
    <h5 class="card-title">{{ resource.title }}</h5>
    <p class="card-text text-muted flex-grow-1">{{ resource.description }}</p>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <small class="text-muted">
        <i class="bi bi-file-pdf me-2"></i>{{ resource.pages }} pages
      </small>
      <a [href]="resource.downloadUrl" class="btn btn-accent btn-sm">
        <i class="bi bi-download me-1"></i>Download
      </a>
    </div>
  </div>
</div>
