<div class="card article-card h-100">
  <img *ngIf="article.image" [src]="article.image" class="card-img-top article-card-image" alt="Article image">
  <div class="card-body">
    <span *ngIf="article.category" class="article-category">{{ article.category }}</span>
    <h5 class="card-title">{{ article.title }}</h5>
    <p class="card-text text-muted">{{ article.excerpt }}</p>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <small class="text-muted">
        <i class="bi bi-person me-2"></i>{{ article.author }}
      </small>
      <small class="text-muted">
        <i class="bi bi-clock me-2"></i>{{ article.readTime }} min read
      </small>
    </div>
    <small class="text-muted d-block mb-3">
      <i class="bi bi-calendar me-2"></i>{{ article.date | date: 'MMM d, y' }}
    </small>
    <a [routerLink]="['/blog', article.id]" class="btn btn-primary btn-sm">
      Read More <i class="bi bi-arrow-right ms-1"></i>
    </a>
  </div>
</div>
