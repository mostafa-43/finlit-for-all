<div class="newsletter-form">
  <h4 class="mb-3">Subscribe to Our Newsletter</h4>
  <p class="text-muted mb-4">
    Get the latest financial tips, insights, and resources delivered straight to your inbox.
  </p>

  <div *ngIf="success" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i>
    <strong>Success!</strong> Thank you for subscribing. Check your email for confirmation.
    <button type="button" class="btn-close" (click)="success = false"></button>
  </div>

  <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle me-2"></i>
    {{ error }}
    <button type="button" class="btn-close" (click)="error = ''"></button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="input-group">
      <input
        type="email"
        class="form-control"
        placeholder="Enter your email"
        formControlName="email"
        [class.is-invalid]="submitted && email?.invalid">
      <button class="btn btn-primary" type="submit" id="button-addon2">
        <i class="bi bi-envelope me-1"></i>Subscribe
      </button>
    </div>
    <small *ngIf="submitted && email?.invalid" class="text-danger d-block mt-2">
      <span *ngIf="email?.errors?.['required']">Email is required</span>
      <span *ngIf="email?.errors?.['email']">Please enter a valid email address</span>
    </small>
  </form>
</div>
